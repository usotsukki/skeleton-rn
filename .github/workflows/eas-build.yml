name: eas build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        type: choice
        default: ios
        options:
          - ios
          - android
          - all
      profile:
        description: EAS build profile
        required: true
        type: choice
        default: production
        options:
          - development
          - production
          - prod-apk

permissions:
  contents: read

env:
  # Run the actions' JavaScript on Node 24 ahead of GitHub retiring Node 20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Install, verify, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
      # Job-wide: on a node_modules cache hit the first `yarn` call is the one that fetches Yarn.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
      EXPO_PUBLIC_NODE_ENV: ${{ inputs.profile == 'production' && 'production' || inputs.profile == 'prod-apk' && 'production' || 'development' }}
      EXPO_PUBLIC_ENABLE_DEV_MODE: ${{ inputs.profile == 'production' && 'false' || inputs.profile == 'prod-apk' && 'false' || 'true' }}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
      EXPO_PUBLIC_BASE_API_URL: ${{ vars.EXPO_PUBLIC_BASE_API_URL }}
      EXPO_PUBLIC_EAS_OWNER: ${{ vars.EXPO_PUBLIC_EAS_OWNER }}
      EXPO_PUBLIC_APP_NAME: ${{ vars.EXPO_PUBLIC_APP_NAME }}
      EXPO_PUBLIC_APP_SLUG: ${{ vars.EXPO_PUBLIC_APP_SLUG }}
      EXPO_PUBLIC_APP_SCHEME: ${{ vars.EXPO_PUBLIC_APP_SCHEME }}
      EXPO_PUBLIC_IOS_BUNDLE_ID: ${{ vars.EXPO_PUBLIC_IOS_BUNDLE_ID }}
      EXPO_PUBLIC_IOS_BUNDLE_ID_TESTING: ${{ vars.EXPO_PUBLIC_IOS_BUNDLE_ID_TESTING }}
      EXPO_PUBLIC_ANDROID_PACKAGE: ${{ vars.EXPO_PUBLIC_ANDROID_PACKAGE }}
      EXPO_PUBLIC_ANDROID_PACKAGE_TESTING: ${{ vars.EXPO_PUBLIC_ANDROID_PACKAGE_TESTING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Yarn 4 via packageManager; setup-node's `cache: yarn` only understands Yarn 1.
      - name: Enable corepack
        run: corepack enable

      # The installed tree (patches applied), shared with lint-and-test; a hit skips `yarn install`.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          # package.json too: a hit skips `yarn install --immutable`, the check that catches a stale yarn.lock.
          key: node-modules-${{ runner.os }}-${{ hashFiles('yarn.lock', 'package.json', '.yarnrc.yml', '.nvmrc', 'patches/**') }}

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: yarn install --immutable

      - name: Run linters
        run: yarn lint

      - name: Run tests
        run: yarn test

      - name: Build on EAS
        run: eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait
