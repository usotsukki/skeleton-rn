name: Lint and test
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull requests need the history to check every commit message.
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Yarn 4 via packageManager; setup-node's `cache: yarn` only understands Yarn 1.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      - name: ESLint
        run: yarn lint:js

      - name: Types
        run: yarn lint:ts

      - name: Formatting
        run: yarn lint:format

      - name: Unused code
        run: yarn lint:unused --reporter github-actions

      - name: Tests
        run: yarn test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: >
          jq -r '.total | "### Coverage", "",
          "| Statements | Branches | Functions | Lines |",
          "| --- | --- | --- | --- |",
          "| \(.statements.pct)% | \(.branches.pct)% | \(.functions.pct)% | \(.lines.pct)% |"'
          coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Code duplication
        run: yarn duplication:check

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: >
          yarn commitlint --config commitlint.config.js --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
